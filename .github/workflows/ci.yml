name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit SHA (Dependabot keeps them current).
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No access token: it would end up in /etc/nix/nix.conf.
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Warm up dev shell
        run: nix develop -c true
      - name: Format
        run: nix develop -c cargo fmt --check
      - name: Clippy
        run: nix develop -c cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: nix develop -c cargo test --locked
      - name: cargo deny
        run: nix develop -c cargo deny check
      - name: cargo audit
        run: nix develop -c cargo audit
      # Every dependency is audited or exempted (supply-chain/, docs/dependencies.md).
      - name: cargo vet
        run: nix develop -c cargo vet --locked
      # Stable toolchain: libFuzzer without AddressSanitizer (`-s none`).
      # Longer runs: .github/workflows/fuzz.yml.
      - name: Fuzz smoke run
        run: |
          for t in $(nix develop -c cargo fuzz list); do
            nix develop -c cargo fuzz run -s none "$t" -- -max_total_time=30
          done

  # Unsafe code in lootr and its dependencies, as a report in the job summary.
  geiger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: cargo geiger
        run: |
          nix develop -c scripts/geiger.sh --output-format GitHubMarkdown >geiger.md
          { echo '```'; cat geiger.md; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

  # Release builds are reproducible: both static musl builds twice, from two
  # copies of the source in different directories, must be bit for bit equal
  # (the release workflow does the same for every target incl. macOS).
  reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Build twice and compare
        run: |
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            nix develop .#release -c scripts/release.sh reproduce "$t" dist
          done
          sha256sum dist/*

  # Real environments (users, groups, modes, /proc) are tested in containers
  # only, never on a developer machine (see "Container scenarios" in PLAN.md).
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Container scenarios
        run: containers/run.sh
