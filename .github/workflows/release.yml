name: Release

# Builds, attests and publishes the release of a tag vX.Y.Z. The assets are
# a contract with action.yml and examples/ci/ ("Release artifacts" in
# PLAN.md): the action verifies that the provenance was signed by THIS file
# (.github/workflows/release.yml) at refs/tags/vX.Y.Z on a GitHub-hosted
# runner. Renaming or moving this file breaks every installed action.
#
# Every build runs twice from two copies of the source and fails unless the
# archives are bit for bit identical (scripts/release.sh reproduce). Anyone
# can rebuild a release with the same command and compare with SHA256SUMS.
#
# Third-party actions are pinned by commit SHA. TODO(pin) marks actions whose
# SHA could not be verified when this file was written: replace the zeros
# with the commit SHA of a reviewed release before pushing the first tag.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      epoch: ${{ steps.version.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Tag matches Cargo.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(nix develop .#release -c scripts/release.sh version)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match the Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >>"$GITHUB_OUTPUT"
      - name: Checks
        run: |
          nix develop -c cargo fmt --check
          nix develop -c cargo clippy --locked --all-targets -- -D warnings
          nix develop -c cargo test --locked
          nix develop -c cargo deny check
          nix develop -c cargo vet --locked

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          # Both Linux targets link with rust-lld against the toolchain's
          # bundled musl: no cross C toolchain needed.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: universal-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build twice and compare
        env:
          TARGET: ${{ matrix.target }}
          LOOTR_SOURCE_DATE_EPOCH: ${{ needs.check.outputs.epoch }}
        run: nix develop .#release -c scripts/release.sh reproduce "$TARGET" dist
      - name: Smoke test
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          name="lootr-$VERSION-$TARGET"
          tar -xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP"
          bin="$RUNNER_TEMP/$name/lootr"
          case "$TARGET" in
            x86_64-unknown-linux-musl)
              file "$bin" | grep -q 'static'
              ;;
            aarch64-unknown-linux-musl)
              file "$bin" | grep -q 'ARM aarch64.*statically linked'
              exit 0 # not runnable on this runner
              ;;
            universal-apple-darwin)
              lipo -info "$bin" | grep -q 'x86_64 arm64'
              # Only system libraries (/usr/lib), nothing from Nix or Homebrew.
              if otool -L "$bin" | grep -E '^[[:space:]]' | grep -vE '^[[:space:]]+/usr/lib/'; then
                echo "::error::$TARGET links libraries outside /usr/lib"
                exit 1
              fi
              ;;
          esac
          # Empty environment, empty home: no scan of the runner.
          home=$(mktemp -d)
          env -i HOME="$home" "$bin" --version | grep -qx "lootr $VERSION"
          env -i HOME="$home" "$bin" policy check >/dev/null
      - uses: actions/upload-artifact@0000000000000000000000000000000000000000 # TODO(pin): actions/upload-artifact v4 or later
        with:
          name: archive-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  sbom:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: CycloneDX SBOM
        env:
          LOOTR_SOURCE_DATE_EPOCH: ${{ needs.check.outputs.epoch }}
        run: nix develop .#release -c scripts/release.sh sbom dist
      - uses: actions/upload-artifact@0000000000000000000000000000000000000000 # TODO(pin): actions/upload-artifact v4 or later
        with:
          name: sbom
          path: dist/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  # The only job with write access. It runs no build code: it attests the
  # downloaded files, verifies the attestations exactly like action.yml and
  # creates the release.
  publish:
    needs: [check, build, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # Sigstore keyless signing (GitHub OIDC)
      attestations: write # store the attestations in the repository
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@0000000000000000000000000000000000000000 # TODO(pin): actions/download-artifact v4 or later
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          archives=(lootr-*.tar.gz)
          test "${#archives[@]}" -eq 3
          sha256sum -- "${archives[@]}" >SHA256SUMS
          cat SHA256SUMS
      - name: Attest x86_64-unknown-linux-musl
        id: attest-x86_64-linux
        uses: actions/attest-build-provenance@0000000000000000000000000000000000000000 # TODO(pin): actions/attest-build-provenance v2 or later (Sigstore bundle v0.3)
        with:
          subject-path: dist/lootr-${{ needs.check.outputs.version }}-x86_64-unknown-linux-musl.tar.gz
      - name: Attest aarch64-unknown-linux-musl
        id: attest-aarch64-linux
        uses: actions/attest-build-provenance@0000000000000000000000000000000000000000 # TODO(pin): actions/attest-build-provenance v2 or later (Sigstore bundle v0.3)
        with:
          subject-path: dist/lootr-${{ needs.check.outputs.version }}-aarch64-unknown-linux-musl.tar.gz
      - name: Attest universal-apple-darwin
        id: attest-darwin
        uses: actions/attest-build-provenance@0000000000000000000000000000000000000000 # TODO(pin): actions/attest-build-provenance v2 or later (Sigstore bundle v0.3)
        with:
          subject-path: dist/lootr-${{ needs.check.outputs.version }}-universal-apple-darwin.tar.gz
      - name: Attest SBOM
        id: attest-sbom
        uses: actions/attest-build-provenance@0000000000000000000000000000000000000000 # TODO(pin): actions/attest-build-provenance v2 or later (Sigstore bundle v0.3)
        with:
          subject-path: dist/lootr-${{ needs.check.outputs.version }}.cdx.json
      - name: Bundles and verification
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          B_X86_64_LINUX: ${{ steps.attest-x86_64-linux.outputs.bundle-path }}
          B_AARCH64_LINUX: ${{ steps.attest-aarch64-linux.outputs.bundle-path }}
          B_DARWIN: ${{ steps.attest-darwin.outputs.bundle-path }}
          B_SBOM: ${{ steps.attest-sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$B_X86_64_LINUX" "lootr-$VERSION-x86_64-unknown-linux-musl.tar.gz.sigstore.json"
          cp "$B_AARCH64_LINUX" "lootr-$VERSION-aarch64-unknown-linux-musl.tar.gz.sigstore.json"
          cp "$B_DARWIN" "lootr-$VERSION-universal-apple-darwin.tar.gz.sigstore.json"
          cp "$B_SBOM" "lootr-$VERSION.cdx.json.sigstore.json"
          # The same check action.yml runs before it unpacks anything.
          for f in lootr-*.tar.gz "lootr-$VERSION.cdx.json"; do
            gh attestation verify "$f" --bundle "$f.sigstore.json" \
              --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/v$VERSION" \
              --deny-self-hosted-runners
          done
      - name: Create release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "v$VERSION" --repo "$REPO" --verify-tag "${prerelease[@]}" \
            --title "lootr $VERSION" --generate-notes \
            lootr-*.tar.gz lootr-*.tar.gz.sigstore.json SHA256SUMS \
            "lootr-$VERSION.cdx.json" "lootr-$VERSION.cdx.json.sigstore.json"

  # End-to-end test of the contract: the action from this tag downloads the
  # published release over HTTPS, verifies it and runs it, on every runner
  # kind it supports.
  action:
    needs: [check, publish]
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: GitHub-hosted arm64 runners (free for public
        # repositories); drop it for a private repository without them.
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: lootr action
        id: lootr
        uses: ./
        continue-on-error: true # findings on the runner are not the point here
        with:
          version: ${{ needs.check.outputs.version }}
          repository: ${{ github.repository }}
          sarif: "false"
          fail-on: critical
      - name: The action verified and ran the release
        env:
          CODE: ${{ steps.lootr.outputs.exit-code }}
          MARKDOWN: ${{ steps.lootr.outputs.markdown-file }}
        run: |
          set -euo pipefail
          echo "lootr exit code: ${CODE:-none}"
          case "$CODE" in 0 | 1) ;; *) exit 1 ;; esac
          test -s "$MARKDOWN"
