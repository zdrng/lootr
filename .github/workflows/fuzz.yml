name: Fuzz

# Longer fuzzing than the 30 s smoke run in CI: every target for 20 minutes,
# every night. libFuzzer without AddressSanitizer on the flake's stable
# toolchain (`-s none`, see fuzz/Cargo.toml). Every run starts from an empty
# corpus (fuzz/corpus is not committed and nothing is persisted between
# runs); crashes, timeouts and OOM inputs are uploaded as artifacts.
#
# A crash input may contain whatever the fuzzer generated, never secrets: the
# targets only see generated bytes.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        required: false
        default: "1200"

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: List fuzz targets
        id: list
        run: |
          set -euo pipefail
          list=$(nix develop -c cargo fuzz list | jq -R . | jq -cs .)
          echo "list=$list" >>"$GITHUB_OUTPUT"
          echo "$list"

  fuzz:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: nix develop -c cargo fuzz build -s none "$TARGET"
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || '1200' }}
        run: |
          set -euo pipefail
          [[ "$SECONDS_PER_TARGET" =~ ^[0-9]+$ ]] || { echo "::error::seconds must be a number"; exit 2; }
          mkdir -p "fuzz/corpus/$TARGET" "fuzz/artifacts/$TARGET"
          # -timeout: a single input taking 10 s is a hang (parsers are linear).
          # -rss_limit_mb: the limits in the parsers must keep memory bounded.
          nix develop -c cargo fuzz run -s none "$TARGET" -- \
            -max_total_time="$SECONDS_PER_TARGET" -timeout=10 -rss_limit_mb=2048 \
            -print_final_stats=1
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@0000000000000000000000000000000000000000 # TODO(pin): actions/upload-artifact v4 or later
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
