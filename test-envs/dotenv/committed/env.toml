# A project in a git work tree. The harness creates workdir/.git (git cannot
# commit a `.git` directory) and renames gitignore.fixture to .gitignore (a
# real .gitignore here would also apply to the lootr repository). `.env` is
# not ignored, `.env.local` is.
git = ["workdir"]

[rename]
"workdir/gitignore.fixture" = "workdir/.gitignore"

[modes]
"workdir/services/api/.env" = "0644"
