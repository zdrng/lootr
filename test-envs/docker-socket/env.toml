# A Docker socket the user can access. The harness creates the socket (a
# socket cannot be committed) in the fake home, where Docker Desktop and
# rootless setups put it; lootr.toml points the socket probe there.
sockets = ["home/.docker/run/docker.sock"]
# The socket's group depends on the machine running the tests.
ignore_attrs = ["group"]

[modes]
"home/.docker/run/docker.sock" = "0660"
