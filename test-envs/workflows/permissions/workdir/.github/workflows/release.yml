name: Release
on:
  push:
    tags: ["v*"]
permissions: read-all
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: make dist
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
