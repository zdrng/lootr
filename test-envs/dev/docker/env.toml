# Docker client config (DUMMY): an inline Docker Hub login (base64 of
# user:dckr_pat_...), an identity token, a credential store and helpers.
# ~/.docker/certs has a TLS client key readable by others and a CA
# certificate.
secrets = ["{{base64:octo:dckr_pat_:LOOTRCANARYdummyHubToken01}}"]

[modes]
"home/.docker/certs/dummy_key.pem" = "0644"
"home/.docker/certs/ca.pem" = "0644"
