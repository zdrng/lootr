# AWS credentials and config in the fake home (DUMMY). Access key ids are
# written as {{token:<prefix>:<rest>}} placeholders so the repository never
# contains a literal AKIA/ASIA key. The credentials file is readable by the
# group and others.
[env]
AWS_ACCESS_KEY_ID = "{{token:AKIA:LOOTRCANARYENVKY}}"
AWS_SECRET_ACCESS_KEY = "LOOTRCANARY/envSecretKey0123456789abcdefgh"
AWS_PROFILE = "dev"

[modes]
"home/.aws/credentials" = "0644"
