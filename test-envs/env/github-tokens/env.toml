# GitHub tokens in the environment (DUMMY). `{{github_token:<prefix>:<random>}}`
# is expanded by tests/fixtures.rs to prefix + random + valid CRC32 checksum
# (lootr::testing::github_token), so no checksum-valid token is committed.
[env]
GH_TOKEN = "{{github_token:ghp_:LOOTRCANARYclassicTok012345678}}"
GITHUB_TOKEN = "{{github_token:ghs_:LOOTRCANARYactionsTok012345678}}"
GH_OAUTH = "{{github_token:gho_:LOOTRCANARYoauthTok0123456789a}}"
GH_REFRESH = "{{github_token:ghr_:LOOTRCANARYrefreshTok012345678}}"
GH_FINE_GRAINED = "{{github_pat:11LOOTRCANARY0123456789_LOOTRCANARYfineGrainedDummyToken0123456789abcdefghijklmnopq}}"
# Wrong checksum: a typo or an example, not a real token.
GH_TYPO = "ghp_LOOTRCANARYtypoTok0123456789ab000000"
NOT_A_TOKEN = "ghp_short"
